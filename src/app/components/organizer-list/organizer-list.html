<section id="organisateurs" class="py-5">
  <div class="container">
    <h2 class="fw-bold mb-1">
      Organisateurs
      <span class="badge rounded-pill text-bg-primary align-middle fs-6">{{ organizers().length }}</span>
    </h2>
    <p class="text-body-secondary mb-4">Les personnes qui rendent ces conférences possibles.</p>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4 justify-content-center">
      @for (organizer of organizers(); track organizer.id) {
        <div class="col">
          <div class="card h-100 border-0 shadow-sm text-center org-card">
            <div class="card-body">
              <!-- Property binding : [src] et [alt] -->
              <img
                [src]="organizer.picture"
                [alt]="organizer.name"
                class="rounded-circle mb-3 org-photo"
              />
              <h6 class="card-title fw-semibold mb-1">{{ organizer.name }}</h6>
              <p class="small text-body-secondary mb-2">
                <i class="bi bi-mortarboard me-1"></i>{{ organizer.university }}
              </p>
              <!-- Bonus : email cliquable (property binding sur [href]) -->
              <a [href]="'mailto:' + organizer.email" class="small text-decoration-none">
                <i class="bi bi-envelope me-1"></i>{{ organizer.email }}
              </a>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
